<section class="grid">
  <div class="search">
    <input type="text" placeholder="Search...">
  </div>
  <table>
    <thead>
      <tr>
        <th>Order</th>
        <th>Customer</th>
        <th>City</th>
        <th>Status</th>
        <th>Courier</th>
        <th>Amount</th>
        <th>Created</th>
      </tr>
    </thead>
    <tbody>
    <tr *ngFor="let order of orders.reverse()">
      <td>#{{ order.id }}</td>
      <td>{{ order.customer }}</td>
      <td>{{ order.city }}</td>
      <td>
        <span class="status" [class]="'status status_' + order.status">
          {{ order.status }}
        </span>
      </td>
      <td>{{ order.courier }}</td>
      <td>{{ order.amount }}</td>
      <td>{{ order.createdAt }}</td>
    </tr>
    <tr *ngIf="isLoading">
      <td class="empty-state" colspan="10">Loading orders...</td>
    </tr>
    <tr *ngIf="!isLoading && !orders.length">
      <td class="empty-state" colspan="10">No orders found</td>
    </tr>
    </tbody>
  </table>
</section>
